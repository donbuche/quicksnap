[package]
name = "quicksnap"
version = "0.1.0"
edition = "2021"

[dependencies]
eframe = { version = "0.32", default-features = false, features = ["default_fonts", "glow"] }
epaint_default_fonts = "0.32"
egui = "0.32"
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
arboard = "3"
rfd = "0.15"
tiny-skia = "0.11"
ab_glyph = "0.2"
chrono = "0.4"
dirs = "6"
global-hotkey = "0.7"
tray-icon = "0.21"
libc = "0.2"

[target.'cfg(target_os = "macos")'.dependencies]
# Same winit eframe uses; needed to run as a menu-bar-only app (no Dock icon).
winit = "0.30"

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 2
